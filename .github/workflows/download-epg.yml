name: Download EPG files from source

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 17 * * *"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download EPG files
        env:
          OPEN_EPG_GZ_URL: ${{ secrets.open_epg_gz_url }}
          OPEN_EPG_XML_URL: ${{ secrets.open_epg_xml_url }}
          OPEN_EPG_GZ_FILE: ${{ secrets.OPEN_EPG_GZ_FILE }}
          OPEN_EPG_XML_FILE: ${{ secrets.OPEN_EPG_XML_FILE }}
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$OPEN_EPG_GZ_FILE" \
            "$OPEN_EPG_GZ_URL"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$OPEN_EPG_XML_FILE" \
            "$OPEN_EPG_XML_URL"

      - name: Commit and push changes
        env:
          OPEN_EPG_GZ_FILE: ${{ secrets.OPEN_EPG_GZ_FILE }}
          OPEN_EPG_XML_FILE: ${{ secrets.OPEN_EPG_XML_FILE }}
        run: |
          git config user.name "vince-devops"
          git config user.email "vincent.coens@telenet.be"
          git add "$OPEN_EPG_GZ_FILE" "$OPEN_EPG_XML_FILE"
          if git diff --cached --quiet; then
            echo "EPG files are unchanged"
          else
            git commit -m "Update EPG files"
            git push
          fi
